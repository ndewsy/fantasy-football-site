name: Sync week stats

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-week-stats endpoint
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.fantasycollective.ca/api/cron/sync-week-stats")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
