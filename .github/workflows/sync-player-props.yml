name: Sync player props

# No longer scheduled — betting lines are now fetched on demand, one
# player's game at a time, the moment someone adds that player to Start/Sit
# Compare (see lib/ensurePlayerProps.js). This bulk full-league sync is kept
# as a manual escape hatch only (e.g. to warm the cache before a big slate),
# not something that runs automatically and burns through SportsGameOdds'
# monthly object quota fetching hundreds of players nobody was about to
# look at.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-player-props endpoint
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.fantasycollective.ca/api/cron/sync-player-props")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
