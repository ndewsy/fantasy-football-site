name: Snapshot monthly payouts

# Runs just after each month rolls over and locks in last month's per-creator
# payout as a real row in the `payouts` table — without this, the dashboard
# only ever shows "whatever's active right now," so last month's figure is
# gone the moment the new month starts. Pass `period` (workflow_dispatch) to
# backfill a specific past month instead.
on:
  schedule:
    - cron: "10 6 1 * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Month to snapshot, as YYYY-MM (defaults to last month)"
        required: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call snapshot-payouts endpoint
        run: |
          url="https://www.fantasycollective.ca/api/cron/snapshot-payouts"
          if [ -n "${{ github.event.inputs.period }}" ]; then
            url="${url}?period=${{ github.event.inputs.period }}"
          fi
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$url")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
